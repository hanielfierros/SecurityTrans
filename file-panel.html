<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FILE MANAGEMENT — Panel de trabajo por área SecurityTrans.">
  <title>Panel de trabajo — FILE MANAGEMENT</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./file-management.css">
  <script src="./theme.js"></script>
</head>
<body class="fm">
  <header class="fm-nav" id="TOP_BAR">
    <a class="brand" href="./index.html">iData<small>· FILE MANAGEMENT</small></a>
    <span class="nav-pill" id="TOP_AREA">Área</span>
    <span class="meta" id="TOP_USER">Usuario</span>
    <span class="meta" id="TOP_FOLIO">Folio: —</span>
    <span class="meta" id="TOP_STATUS">—</span>
    <span class="spacer"></span>
    <button class="fm-btn" type="button" id="BTN_LOGOUT">Cerrar sesión</button>
  </header>

  <main class="fm-workspace">
    <!-- Panel izquierdo -->
    <section class="fm-panel" id="PANEL">
      <div id="PANEL_CONTENT"><p class="fm-empty">Cargando…</p></div>
    </section>

    <!-- Chat compartido -->
    <section class="fm-chat" id="CHAT">
      <header class="fm-chat-head">
        <span class="avatar" id="CHAT_AVATAR">S</span>
        <div>
          <div class="titulo" id="CHAT_TITULO">Ventana de servicio</div>
          <div class="sub" id="CHAT_SUB">Seleccione un servicio</div>
        </div>
        <span class="spacer"></span>
        <span class="meta" id="CHAT_ESTADO"></span>
      </header>

      <div class="fm-timeline" id="TIMELINE" aria-label="Progreso del servicio"></div>

      <div class="fm-messages" id="MESSAGES">
        <p class="fm-empty" id="CHAT_EMPTY">Seleccione un servicio para consultar su conversación.</p>
      </div>

      <div class="fm-readonly" id="READONLY_BANNER" hidden>
        Servicio cerrado. La información y los documentos están disponibles únicamente para consulta.
      </div>

      <div class="fm-composer" id="COMPOSER" hidden>
        <div class="row">
          <label for="CATEGORIA" class="sr-only">Categoría</label>
          <select id="CATEGORIA"></select>
        </div>
        <div class="fm-attach-preview" id="ATTACH_PREVIEW" hidden></div>
        <label for="MENSAJE" class="sr-only">Mensaje</label>
        <textarea id="MENSAJE" placeholder="Escriba un mensaje…" rows="1"></textarea>
        <div class="row">
          <input type="file" id="FILE_INPUT" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" hidden>
          <button class="fm-icon-btn" type="button" id="BTN_ADJUNTAR" aria-label="Adjuntar archivo" title="Adjuntar archivo">📎</button>
          <button class="fm-icon-btn" type="button" id="BTN_CAMARA" aria-label="Cámara" title="Tomar fotografía">📷</button>
          <span class="spacer"></span>
          <button class="fm-icon-btn send" type="button" id="BTN_ENVIAR" aria-label="Enviar">➤</button>
        </div>
      </div>

      <p class="fm-chat-status" id="CHAT_STATUS"></p>
    </section>
  </main>

  <!-- Visor de adjuntos (imagen y PDF) -->
  <div class="fm-viewer" id="VIEWER" hidden>
    <div class="fm-viewer-top">
      <span class="fm-viewer-title" id="VIEWER_TITLE"></span>
      <span class="spacer"></span>
      <button class="fm-icon-btn" id="VIEWER_ZOOM_IN" aria-label="Acercar" title="Acercar">＋</button>
      <button class="fm-icon-btn" id="VIEWER_ZOOM_OUT" aria-label="Alejar" title="Alejar">−</button>
      <button class="fm-icon-btn" id="VIEWER_OPEN" aria-label="Abrir en pestaña nueva" title="Abrir en pestaña nueva">↗</button>
      <button class="fm-icon-btn" id="VIEWER_DOWNLOAD" aria-label="Descargar" title="Descargar">⬇</button>
      <button class="fm-icon-btn" id="VIEWER_CLOSE" aria-label="Cerrar" title="Cerrar">✕</button>
    </div>
    <div class="fm-viewer-body" id="VIEWER_BODY"></div>
  </div>

  <script type="module" src="./file-management.js"></script>
</body>
</html>
